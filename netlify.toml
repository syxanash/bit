# example netlify.toml
[build]
  command = "npm run build"
  functions = "netlify/functions"
  publish = "dist"
  ## Add COOP and COEP headers site-wide so features like SharedArrayBuffer work
  ## Cross-Origin-Opener-Policy: same-origin
  ## Cross-Origin-Embedder-Policy: require-corp
  ## Note: if you load cross-origin resources (fonts, scripts, images) they must
  ## send CORP/CORS headers compatible with COEP (e.g. `Cross-Origin-Resource-Policy: cross-origin`
  ## or served from the same origin). See README notes below for details.

  [[headers]]
    for = "/*"
    [headers.values]
      Cross-Origin-Opener-Policy = "same-origin"
      Cross-Origin-Embedder-Policy = "require-corp"

  ## Uncomment to use this redirect for Single Page Applications like create-react-app.
  ## Not needed for static site generators.
  #[[redirects]]
  #  from = "/*"
  #  to = "/index.html"
  #  status = 200

  ## (optional) Settings for Netlify Dev
  ## https://github.com/netlify/cli/blob/main/docs/netlify-dev.md#project-detection
  #[dev]
  #  command = "yarn start" # Command to start your dev server
  #  port = 3000 # Port that the dev server will be listening on
  #  publish = "dist" # Folder with the static content for _redirect file

  ## more info on configuring this file: https://ntl.fyi/file-based-build-config
